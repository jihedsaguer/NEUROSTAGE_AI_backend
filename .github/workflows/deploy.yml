name: Build and Deploy Backend

on:
  push:
    branches: [master]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test -- --forceExit
        continue-on-error: true

  build-and-push:
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags : |
           ${{ secrets.DOCKERHUB_USERNAME }}/neurostage-backend:latest
                ${{ secrets.DOCKERHUB_USERNAME }}/neurostage-backend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync infrastructure files to VM
        run: |
          # Copy the infrastructure files the VM reads at runtime into ~/neurostage
          # so docker compose always uses the latest versions from this commit.
          cp "$GITHUB_WORKSPACE/docker-compose.yml" ~/neurostage/docker-compose.yml
          cp "$GITHUB_WORKSPACE/nginx.conf"         ~/neurostage/nginx.conf

      - name: Deploy on VM
        run: |
          cd ~/neurostage
          echo "${{ github.sha }}" > .last-deploy-app-sha
          # Pull the new backend image once — shared by both app and app_replica
          docker compose pull app
          # Start/recreate both backend instances and reload nginx config
          docker compose up -d app app_replica nginx

      - name: Wait and verify health
        run: |
          cd ~/neurostage
          echo "Waiting for backend to become healthy..."
          for i in {1..15}; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/api/auth/login -X POST -H "Content-Type: application/json" -d '{"email":"healthcheck@test.com","password":"wrong"}')
            if [ "$CODE" = "400" ] || [ "$CODE" = "401" ] || [ "$CODE" = "500" ]; then
              echo "Backend is responding (HTTP $CODE)."
              # Confirm replica is also running
              docker compose ps app_replica --format json | grep -q "running" \
                && echo "app_replica is running." \
                || echo "WARNING: app_replica is not in running state."
              exit 0
            fi
            echo "Attempt $i/15 - not ready yet (got HTTP $CODE), waiting 3s..."
            sleep 3
          done
          echo "Backend failed health check after 45s"
          docker compose logs app --tail=50
          exit 1

      - name: Cleanup old images
        if: success()
        run: docker image prune -f