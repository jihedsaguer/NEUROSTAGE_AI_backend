# ──────────────────────────────────────────────────────────────────────────────
# NeuroStage AI — Nginx production configuration
# Hardened | Load-balanced REST API | Structured JSON access logs
# ──────────────────────────────────────────────────────────────────────────────

# ── Security: hide Nginx version in Server response header and error pages ──
server_tokens off;

# ── Structured JSON access log format ────────────────────────────────────────
# Every field uses native Nginx variables — no hardcoded values.
# The format is designed to be machine-readable by n8n (future monitoring phase).
log_format neurostage_json escape=json
    '{'
        '"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"forwarded_for":"$http_x_forwarded_for",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_response_time":"$upstream_response_time",'
        '"request_length":$request_length,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"user_agent":"$http_user_agent",'
        '"http_referer":"$http_referer"'
    '}';

# ── REST API rate limiting ────────────────────────────────────────────────────
# 10 requests/second per client IP with a burst of 20.
# nodelay: burst requests are served immediately (not queued) up to the burst
# limit, then surplus requests receive 429. This avoids blocking normal React
# SPA traffic while still protecting against simple abuse.
# Applied only to /api/ — does not affect /socket.io/, /uploads/, or frontend.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# ── REST API upstream (load-balanced) ────────────────────────────────────────
# least_conn distributes to the backend with the fewest active connections.
# Open-source Nginx does not support active health checks — Docker healthchecks
# are relied upon to ensure only healthy containers are in service.
# If a backend is temporarily unreachable, Nginx will fail the request and
# return 502; it does not automatically remove unhealthy upstreams (Nginx Plus
# feature). This is documented as a known limitation for this phase.
upstream neurostage_backend {
    least_conn;
    server neurostage_app:3000;
    server neurostage_app_replica:3000;
}

server {
    listen 80;
    server_name _;

    # Use structured JSON log for all requests on this server block
    access_log /var/log/nginx/access.log neurostage_json;
    error_log  /var/log/nginx/error.log warn;

    # ── Request body limit ──────────────────────────────────────────────────
    # Preserved at 10M — required for CV/document uploads routed through /api/
    client_max_body_size 10M;

    # ── Minimal security headers ────────────────────────────────────────────
    # X-Content-Type-Options: prevents MIME-type sniffing
    # X-Frame-Options: prevents clickjacking via iframes
    # Referrer-Policy: limits referrer leakage to same origin
    # NOTE: Content-Security-Policy is intentionally omitted — the React SPA
    # may depend on external resources and CSP requires per-app validation.
    # NOTE: HSTS is intentionally omitted — HTTP-only deployment; must be
    # added only after HTTPS is confirmed fully operational.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Static uploads ──────────────────────────────────────────────────────
    # Preserved exactly from original configuration.
    location /uploads/ {
        alias /var/neurostage/uploads/;
        types { }
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        autoindex off;
    }

    # ── Socket.IO WebSocket proxy ───────────────────────────────────────────
    # INTENTIONALLY routes to neurostage_app ONLY — NOT load-balanced.
    # The Socket.IO gateway uses the default in-memory adapter. Load-balancing
    # Socket.IO without a shared Redis adapter would cause clients on different
    # instances to miss broadcasts from other instances. This will be addressed
    # in a future phase when the Redis adapter is added.
    location /socket.io/ {
        proxy_pass http://neurostage_app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── REST API — load-balanced ────────────────────────────────────────────
    # Proxies to the neurostage_backend upstream (both NestJS instances).
    # The trailing slash on proxy_pass intentionally strips the /api/ prefix,
    # preserving the existing behavior: /api/foo → NestJS as /foo.
    # Rate limiter applied here only — OPTIONS preflight is excluded via the
    # nested location to avoid blocking CORS handshakes.
    location /api/ {
        # Allow CORS preflight without rate limiting
        if ($request_method = OPTIONS) {
            return 204;
        }

        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://neurostage_backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ── React frontend ──────────────────────────────────────────────────────
    # Preserved exactly from original configuration.
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
