services:

  db:
    image: pgvector/pgvector:pg16
    container_name: neurostage_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-neurostage_db}
      POSTGRES_USER: ${DB_USERNAME:-neuro_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-neuro_password}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - neurostage_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-neuro_admin} -d ${DB_NAME:-neurostage_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: jihedxx/neurostage-backend:latest
    container_name: neurostage_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-neuro_admin}
      DB_PASSWORD: ${DB_PASSWORD:-neuro_password}
      DB_NAME: ${DB_NAME:-neurostage_db}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      UPLOAD_DIR: /var/neurostage/uploads
      UPLOAD_BASE_URL: ${UPLOAD_BASE_URL:-http://localhost}
      AI_SERVICE_URL: http://neurostage_ai:8001
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      BACKEND_URL: ${BACKEND_URL:-http://localhost/api}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@neurostage.local}
      N8N_CV_PROCESSED_WEBHOOK_URL: ${N8N_CV_PROCESSED_WEBHOOK_URL}
      N8N_INTERNSHIP_ACCEPTED_WEBHOOK_URL: ${N8N_INTERNSHIP_ACCEPTED_WEBHOOK_URL}
      N8N_INTERNSHIP_REJECTED_WEBHOOK_URL: ${N8N_INTERNSHIP_REJECTED_WEBHOOK_URL}
    volumes:
      - uploads:/var/neurostage/uploads
    networks:
      - neurostage_network
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Second NestJS instance for REST API load balancing ─────────────────────
  # Uses the same production image as app.
  # Socket.IO is NOT load-balanced — Nginx routes /socket.io/ exclusively to
  # neurostage_app. ChatGateway uses Socket.IO in-memory adapter; horizontal
  # WebSocket scaling requires a Redis adapter (deferred to a future phase).
  # Host port intentionally NOT published — reachable inside neurostage_network
  # only, by the Nginx upstream. The primary app retains 3000:3000 for direct
  # access and NESTJS_INTERNAL_URL compatibility with the AI service.
  app_replica:
    image: jihedxx/neurostage-backend:latest
    container_name: neurostage_app_replica
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-neuro_admin}
      DB_PASSWORD: ${DB_PASSWORD:-neuro_password}
      DB_NAME: ${DB_NAME:-neurostage_db}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      UPLOAD_DIR: /var/neurostage/uploads
      UPLOAD_BASE_URL: ${UPLOAD_BASE_URL:-http://localhost}
      AI_SERVICE_URL: http://neurostage_ai:8001
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      BACKEND_URL: ${BACKEND_URL:-http://localhost/api}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@neurostage.local}
      N8N_CV_PROCESSED_WEBHOOK_URL: ${N8N_CV_PROCESSED_WEBHOOK_URL}
      N8N_INTERNSHIP_ACCEPTED_WEBHOOK_URL: ${N8N_INTERNSHIP_ACCEPTED_WEBHOOK_URL}
      N8N_INTERNSHIP_REJECTED_WEBHOOK_URL: ${N8N_INTERNSHIP_REJECTED_WEBHOOK_URL}
    volumes:
      - uploads:/var/neurostage/uploads
    networks:
      - neurostage_network
    # No host port — internal only
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ai:
    image: jihedxx/neurostage-ai:latest
    container_name: neurostage_ai
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-neuro_admin}:${DB_PASSWORD:-neuro_password}@db:5432/${DB_NAME:-neurostage_db}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      # Always points to the primary app — AI callbacks need a single stable target
      NESTJS_INTERNAL_URL: http://neurostage_app:3000
      UPLOAD_DIR: /var/neurostage/uploads
      UPLOAD_BASE_URL: ${UPLOAD_BASE_URL:-http://localhost}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      GENERATION_MODEL: ${GENERATION_MODEL:-llama3.2}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ENVIRONMENT: production
    volumes:
      - uploads:/var/neurostage/uploads
    networks:
      - neurostage_network
    ports:
      - "8001:8001"

  nginx:
    image: nginx:1.27-alpine
    container_name: neurostage_nginx
    restart: unless-stopped
    depends_on:
      - app
      - app_replica
      - ai
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/var/neurostage/uploads:ro
      - ssl:/etc/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - neurostage_network

  frontend:
    image: jihedxx/neurostage-frontend:latest
    container_name: neurostage_frontend
    restart: unless-stopped
    depends_on:
      - app
    networks:
      - neurostage_network

volumes:
  db_data:
  uploads:
  ssl:
  # Dedicated volume for structured Nginx access logs.
  # Persists across Nginx container restarts and recreations.
  # Will be consumed by the n8n monitoring workflow in the next phase.
  nginx_logs:

networks:
  neurostage_network:
    name: neurostage_network
